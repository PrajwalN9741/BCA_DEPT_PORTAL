{% extends 'base.html' %}

{% block title %}Create Account - BCA Department Portal{% endblock %}

{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border rounded-4 overflow-hidden">
                <!-- Registration Header -->
                <div class="bg-primary text-white p-4 text-center">
                    <h4 class="fw-bold mb-0"><i class="fa-solid fa-user-plus me-2"></i>Create Student Account</h4>
                    <p class="small text-white-50 mb-0 mt-1">Register to submit BCA admissions applications and book events tickets</p>
                </div>
                
                <!-- Registration Inputs -->
                <div class="card-body p-4 p-lg-5">
                    <form action="{{ url_for('student.register') }}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username *</label>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="Choose username">
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="name@domain.com">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter strong password">
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
                        </div>
                        
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold mb-3">
                            <i class="fa-solid fa-user-plus me-2"></i>Register Account
                        </button>
                        
                        <div class="text-center">
                            <span class="small text-muted">Already registered? </span>
                            <a href="{{ url_for('student.login') }}" class="small fw-bold text-decoration-none">Login Here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
